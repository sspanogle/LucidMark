name: Automated Guardrails

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend Quality Gates
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run type-check --if-present

      - name: Unit tests
        run: |
          if npm run | grep -q "test:run"; then
            npm run test:run
          else
            npm run test --if-present -- --run
          fi

  backend:
    name: Backend Quality Gates
    runs-on: ubuntu-latest
    needs: frontend
    if: ${{ hashFiles('src-tauri/Cargo.toml') != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

  docs:
    name: Documentation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Spell check documentation
        if: ${{ hashFiles('**/*.md') != '' }}
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: ""
          # Ignore missing config; action provides defaults.
        continue-on-error: true

      - name: Report documentation lint status
        run: echo "Documentation check complete"
